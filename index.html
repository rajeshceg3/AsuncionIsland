<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asunción</title>
<meta name="description" content="A quiet journey around Asunción Island - the volcano, the jungle, the black-sand shore, and the birds that own the night.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 24 L16 8 L26 24 Z' fill='%23453b33'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="island" aria-label="A living scene of Asunción Island. Drag slowly to drift."></canvas>

<div id="veil" aria-hidden="true">
  <h1 class="wordmark">Asunción</h1>
</div>

<header id="masthead" class="chrome" aria-hidden="true">
  <span class="wordmark-small">Asunción</span>
</header>

<p id="caption" class="chrome" role="status"></p>
<p id="whisper" class="chrome"></p>

<nav id="dock" class="chrome" aria-label="Faces of the island">
  <button class="dot" data-scene="0" aria-label="The volcano at dawn"><i></i><span>Volcano</span></button>
  <button class="dot" data-scene="1" aria-label="The jungle slopes"><i></i><span>Jungle</span></button>
  <button class="dot" data-scene="2" aria-label="The black-sand shore"><i></i><span>Shore</span></button>
  <button class="dot" data-scene="3" aria-label="The seabird colony at night"><i></i><span>Wings</span></button>
</nav>

<script type="module" src="main.js"></script>
</body>
</html>
